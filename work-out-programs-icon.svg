    <!-- โลโก้ลูกแบดมินตันสายฟ้า (กลับด้านและเอียง -25 องศา) -->
    <g transform="translate(256, 256) scale(-14, 14) rotate(-25) translate(-12, -12)">
        <!-- ขนไก่ -->
        <path d="M5 13L2 2L7.5 5.5L12 1L16.5 5.5L22 2L19 13" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="8" y1="13" x2="8" y2="5.5" stroke="#e0e0e0" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="16" y1="13" x2="16" y2="5.5" stroke="#e0e0e0" stroke-width="1.2" stroke-linecap="round"/>
        
        <!-- หัวจุกก๊อกสีทอง -->
        <path d="M12 23C15.5 23 18 20 18 16.5C18 13.5 15.5 12 12 12C8.5 12 6 13.5 6 16.5C6 20 8.5 23 12 23Z" fill="#ffc107"/>
        
        <!-- แถบคาดสีแดง -->
        <path d="M6.2 15C8.5 16.5 15.5 16.5 17.8 15" stroke="#d32f2f" stroke-width="1.5" stroke-linecap="round"/>
        
        <!-- สายฟ้าสีทอง -->
        <path d="M13.5 2L8 10H12.5L11 17L18 8H13L14.5 2Z" fill="#ffc107" stroke="#1a1a1a" stroke-width="0.8" stroke-linejoin="round"/>
